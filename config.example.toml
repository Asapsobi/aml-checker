# amlcheck settings. Copy to ~/.amlcheck/config.toml (or point AMLCHECK_CONFIG at your copy)
# and change what you need: anything left out keeps the default shown here.
# API keys never go in this file. They belong in .env (see .env.example).

[freshness]
# Hours since the OFAC list was last downloaded before it counts as "stale", which makes the
# verdict INCOMPLETE (PRD §11). OFAC's own publish date does not count: it doesn't publish daily.
sanctions_max_age_hours = 48
# How far the local TRON USDT blacklist index may lag the chain (PRD §11).
tron_index_max_lag_minutes = 60

[cache]
# How long a result for the screened address is reused. Errors are never cached (PRD §11).
target_ttl_seconds = 900

[network]
# How long to wait for any single API request.
timeout_seconds = 30.0
# When an API asks to "retry after N seconds", wait if N is at most this. Otherwise report the
# source as failed (the result becomes INCOMPLETE) instead of stalling the check.
max_retry_after_seconds = 10.0

[rules]
# Change a rule's severity (PRD §5.2), for example: severity = { "R-EXP-01" = "BLOCK" }
# Every rule but R-SYS-01 can change, to BLOCK or REVIEW. R-SYS-01 is fixed: a missing or
# outdated source always makes the result INCOMPLETE.
severity = {}

[exposure]
# How far back the address's USDT transfers are read (R-EXP-02's N).
lookback_days = 180
# More transfers than this in the lookback make the result INCOMPLETE rather than clean.
max_transfers = 5000
# R-EXP-02: REVIEW when at least this share of the USDT received came from flagged addresses.
flagged_inflow_share = 0.05

[heuristics]
# R-HEU-01: the address's first activity is younger than this (a low-priority REVIEW).
new_address_days = 7
# R-HEU-02: at least this share of the USDT received left again within pass_through_hours.
pass_through_share = 0.9
pass_through_hours = 24
# R-HEU-03: more than fan_in_senders different addresses each sent under fan_in_small_usdt
# within fan_in_window_hours.
fan_in_senders = 50
fan_in_small_usdt = 100.0
fan_in_window_hours = 24
# R-HEU-04: the address paid more than fan_out_recipients different addresses within
# fan_out_window_hours.
fan_out_recipients = 50
fan_out_window_hours = 24
# R-HEU-05: a counterparty in labels.csv carries one of these tags.
risky_tags = ["mixer", "bridge", "high_risk"]
# Counterparties with this tag are left out of R-HEU-02 to R-HEU-04. They never cancel a
# sanctions or freeze finding.
allowlist_tag = "allowlist"

[ofac]
# Official OFAC Sanctions List Service download (see docs/verification.md).
sdn_url = "https://sanctionslistservice.ofac.treas.gov/api/PublicationPreview/exports/SDN.XML"

[eagle_virtual]
base_url = "https://eaglevirtual.com"
# Free plan: 1 request per second and 1,000 checks per day (verified 2026-09-28).
requests_per_second = 1.0
daily_limit = 1000
# Warn once this share of the daily limit is used.
quota_warning_ratio = 0.8
# Remote lookups of counterparties per check. 0 keeps the Free plan quota for the address
# being screened (PRD §11).
max_remote_counterparty_lookups = 0

[tron]
trongrid_url = "https://api.trongrid.io"
usdt_contract = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t"

[bsc]
usdt_contract = "0x55d398326f99059fF775485246999027B3197955"
# BSC transfer history, from Envio HyperSync with HYPERSYNC_API_TOKEN (docs/verification.md, V12).
# The same service also answers at https://56.hypersync.xyz, if this name ever fails to resolve.
hypersync_url = "https://bsc.hypersync.xyz"
