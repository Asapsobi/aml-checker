[project]
name = "amlcheck"
version = "0.1.0"
description = "Local AML screening for USDT addresses on TRON and BNB Smart Chain"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "base58>=2.1.1",
    "defusedxml>=0.7.1",
    "eth-hash[pycryptodome]>=0.8.0",
    "eth-utils>=6.0.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "rich>=15.0.0",
    "tenacity>=9.1.4",
    "typer>=0.27.2",
]

[project.scripts]
amlcheck = "amlcheck.cli:app"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
# docs/ holds the PRD, which tooling must not rewrite.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "DTZ", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, and use made-up tokens (S105, S106).
"tests/**" = ["S101", "S105", "S106"]
# Verification scripts only open the fixed https URLs written in them.
"scripts/**" = ["S310"]

[tool.mypy]
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.16.9",
    "types-defusedxml>=0.7.0.20260504",
]
